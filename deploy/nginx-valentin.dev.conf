# Final HTTPS config for valentin.dev after Certbot created certificates.
# If you do not use www.valentin.dev, remove it from server_name and from the Certbot command.

server {
    listen 80;
    listen [::]:80;
    server_name valentin.dev www.valentin.dev;

    root /var/www/valentin.dev/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/valentin.dev/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name valentin.dev www.valentin.dev;

    root /var/www/valentin.dev/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/valentin.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valentin.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /404.html;
    }

    error_page 404 /404.html;
}
