# Initial HTTP-only config for the first Certbot run.
# Use this before TLS certificates exist.

server {
    listen 80;
    listen [::]:80;
    server_name valentin.dev www.valentin.dev;

    root /var/www/valentin.dev/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/valentin.dev/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
